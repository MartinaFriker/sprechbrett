<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sprechbrett</title>
<meta name="description" content="Kommunikationsbrett mit Bildkarten: Karten auf den Satzstreifen legen und vorlesen lassen.">
<meta name="theme-color" content="#FBCF3A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sprechbrett">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <section id="board">
    <div id="toolbar"></div>
    <div id="strips"></div>
    <nav id="tabs"></nav>
  </section>
  <section id="sentence-bar">
    <button id="btn-speak" class="round-btn" type="button" aria-label="Sprechen"></button>
    <div id="sentence" class="sentence-strip"></div>
    <button id="btn-return-all" class="round-btn" type="button" aria-label="Alle Karten zurück"></button>
  </section>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
